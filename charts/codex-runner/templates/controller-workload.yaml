apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-runner-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-runner-controller
    spec:
      serviceAccountName: codex-runner-controller
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "codex-runner.image" (dict "root" . "component" "controller") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/runner-controller"]
          args: ["--metrics-bind-address=:8080"]
          env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUNNER_AGENT_IMAGE
              value: {{ include "codex-runner.image" (dict "root" . "component" "agent") | quote }}
            - name: RUNNER_EVENT_URL
              value: http://runner-api.{{ .Release.Namespace }}.svc.cluster.local:8080/internal/runs
            - name: RUNNER_HEARTBEAT_URL
              value: http://runner-api.{{ .Release.Namespace }}.svc.cluster.local:8080/internal/sessions
            - name: RUNNER_AUTH_REFRESH_URL
              value: http://runner-api.{{ .Release.Namespace }}.svc.cluster.local:8080/internal/auth/refresh
            - name: RUNNER_AGENT_TOKEN_SECRET_NAME
              value: {{ .Values.existingSecret | quote }}
            - name: RUNNER_AGENT_TOKEN_SECRET_KEY
              value: agent-token
            - name: RUNNER_API_TOKEN_SECRET_NAME
              value: {{ .Values.existingSecret | quote }}
            - name: RUNNER_API_TOKEN_SECRET_KEY
              value: api-token
            - name: RUNNER_SERVICE_ACCOUNT_NAME
              value: codex-runner-agent
          ports:
            - name: metrics
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
{{ toYaml .Values.controller.resources | indent 12 }}
