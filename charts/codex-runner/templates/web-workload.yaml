apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner-pwa
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-runner-pwa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-runner-pwa
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: {{ include "codex-runner.image" (dict "root" . "component" "pwa") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.web.resources | indent 12 }}
