apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-runner-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-runner-api
    spec:
      serviceAccountName: codex-runner-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "codex-runner.image" (dict "root" . "component" "api") | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/runner-api"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUNNER_API_ADDR
              value: :8080
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LIBSQL_URL
              value: {{ default (printf "http://libsql.%s.svc.cluster.local:8080" .Release.Namespace) .Values.libsql.url | quote }}
            - name: LIBSQL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: libsql-auth-token
                  optional: true
            - name: RUNNER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: api-token
            - name: RUNNER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: agent-token
            - name: RUNNER_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: runner-auth-encryption-key
                  optional: true
            {{- if .Values.api.model }}
            - name: CODEX_MODEL
              value: {{ .Values.api.model | quote }}
            {{- end }}
            {{- if .Values.api.gitCredentialsSecretName }}
            - name: CODEX_GIT_CREDENTIALS_SECRET_NAME
              value: {{ .Values.api.gitCredentialsSecretName | quote }}
            {{- end }}
            - name: CODEX_APPROVAL_POLICY
              value: {{ .Values.api.approvalPolicy | quote }}
            - name: CODEX_CWD
              value: {{ .Values.api.cwd | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
