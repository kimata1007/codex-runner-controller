{{- if .Values.libsql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: libsql
spec:
  serviceName: libsql
  replicas: {{ .Values.libsql.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: libsql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libsql
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: libsql
          image: {{ .Values.images.libsql | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: SQLD_NODE
              value: primary
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/sqld
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.libsql.resources | indent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- if .Values.libsql.storage.storageClassName }}
        storageClassName: {{ .Values.libsql.storage.storageClassName | quote }}
        {{- end }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.libsql.storage.size | quote }}

{{- end }}
