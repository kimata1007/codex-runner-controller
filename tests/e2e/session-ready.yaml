apiVersion: codexrunner.io/v1alpha1
kind: CodexSession
metadata:
  name: e2e-ready
  namespace: codex-system
spec:
  conversationId: e2e-ready
  desiredState: Active
  idleTimeoutSeconds: 1800
  sessionData:
    storageClassName: standard
    size: 100Mi
    retain: false
  execution:
    approvalPolicy: never
