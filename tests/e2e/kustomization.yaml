apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codex-system
resources:
  - ../../config/namespace.yaml
  - ../../config/crd
  - ../../config/rbac
  - ../../config/manager
  - ../../config/api
  - ../../config/libsql
images:
  - name: ghcr.io/kimata1007/codex-runner-api
    newName: local/runner-api
    newTag: e2e
  - name: ghcr.io/kimata1007/codex-runner-controller
    newName: local/runner-controller
    newTag: e2e
secretGenerator:
  - name: codex-runner-tokens
    literals:
      - api-token=e2e-only-api-token
      - agent-token=e2e-only-agent-token
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: codex-runner-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codex-runner-controller
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: RUNNER_AGENT_IMAGE
                    value: local/runner-agent:e2e
  # The upstream libSQL docker-wrapper.sh attempts chown during startup.
  # Kind CI bypasses that wrapper and invokes sqld directly as root; the
  # production StatefulSet and its entrypoint remain unchanged.
  - target:
      kind: StatefulSet
      name: libsql
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: libsql
      spec:
        template:
          spec:
            containers:
              - name: libsql
                command: ["/bin/sqld"]
                args:
                  - --db-path
                  - /var/lib/sqld/iku.db
                  - --http-listen-addr
                  - 0.0.0.0:8080
                  - --grpc-listen-addr
                  - 0.0.0.0:5001
                securityContext:
                  runAsUser: 0
                  runAsGroup: 0
  # The libSQL database only needs ephemeral storage for this CI run.
  # Kind's host-path PVC prevents the pinned image from chown-ing iku.db.
  # Keep the production StatefulSet untouched while using an emptyDir here.
  - target:
      kind: StatefulSet
      name: libsql
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: data
            emptyDir: {}
