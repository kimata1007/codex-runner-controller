apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codex-system
resources:
  - ../../config/namespace.yaml
  - ../../config/crd
  - ../../config/rbac
  - ../../config/manager
  - ../../config/api
  - ../../config/postgres
images:
  - name: ghcr.io/kimata1007/codex-runner-api
    newName: local/runner-api
    newTag: e2e
  - name: ghcr.io/kimata1007/codex-runner-controller
    newName: local/runner-controller
    newTag: e2e
secretGenerator:
  - name: codex-runner-tokens
    literals:
      - api-token=e2e-only-api-token
      - agent-token=e2e-only-agent-token
      - postgres-password=e2e-only-db-password
      - database-url=postgres://codex:e2e-only-db-password@postgres:5432/codex?sslmode=disable
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: codex-runner-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: codex-runner-controller
      spec:
        template:
          spec:
            containers:
              - name: controller
                env:
                  - name: RUNNER_AGENT_IMAGE
                    value: local/runner-agent:e2e
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: remove
        path: /spec/volumeClaimTemplates
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: data
            emptyDir: {}
