# Deliberately invalid Secret reference to verify detection of
# CreateContainerConfigError, without exposing any actual credentials.
apiVersion: codexrunner.io/v1alpha1
kind: CodexSession
metadata:
  name: e2e-missing-secret
  namespace: codex-system
spec:
  conversationId: e2e-missing-secret
  desiredState: Active
  idleTimeoutSeconds: 1800
  sessionData:
    storageClassName: standard
    size: 100Mi
    retain: false
  execution:
    approvalPolicy: never
  repository:
    url: https://example.invalid/no-checkout.git
    revision: main
  credentialsRef:
    name: deliberately-absent-git-token
