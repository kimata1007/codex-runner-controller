apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: codex-gvisor
# The issuer test checks Kubernetes runtime-class binding with stock Kind.
handler: runc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-node-proxy
  namespace: codex-security
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: codex-node-proxy
  namespace: codex-security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-node-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-node-proxy
    spec:
      serviceAccountName: codex-node-proxy
      containers:
        - name: token-fixture
          image: alpine:3.24.0@sha256:a2d49ea686c2adfe3c992e47dc3b5e7fa6e6b5055609400dc2acaeb241c829f4
          command: ["/bin/sleep", "3600"]
          volumeMounts:
            - name: identity
              mountPath: /var/run/codex
              readOnly: true
      volumes:
        - name: identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: codexrunner.io/identity-issuer
                  expirationSeconds: 600
---
apiVersion: codexrunner.io/v1alpha1
kind: CodexSession
metadata:
  name: issuer-e2e
  namespace: codex-sessions
spec:
  conversationId: issuer-e2e
  desiredState: Active
  sessionData:
    size: 1Gi
    retain: false
  execution:
    approvalPolicy: never
