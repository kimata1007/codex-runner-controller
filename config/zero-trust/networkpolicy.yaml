# Quarantine is intentional until the trusted CNI integration is installed.
# Do not add broad namespace or internet allow rules to this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: codex-execution
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
