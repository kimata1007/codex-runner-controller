apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: libsql
spec:
  serviceName: libsql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: libsql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: libsql
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: libsql
          image: ghcr.io/tursodatabase/libsql-server:v0.24.32
          imagePullPolicy: IfNotPresent
          env:
            - name: SQLD_NODE
              value: primary
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /var/lib/sqld
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
