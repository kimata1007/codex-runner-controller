apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-model-proxy
  namespace: codex-security
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: codex-model-proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/name: codex-model-proxy}
    spec:
      serviceAccountName: codex-model-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: model-proxy
          image: ghcr.io/kimata1007/codex-model-proxy:v0.0.18
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: ["/model-proxy", "-healthcheck"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: socket, mountPath: /run/codex-node/model}
            - {name: credentials, mountPath: /var/run/codex/openai, readOnly: true}
      volumes:
        - name: socket
          hostPath: {path: /run/codex-node/model, type: Directory}
        - name: credentials
          secret:
            secretName: codex-openai-model
            defaultMode: 0440
            items: [{key: api-key, path: api-key}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-proxy-unix-only
  namespace: codex-security
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: codex-model-proxy}
  policyTypes: [Ingress]
