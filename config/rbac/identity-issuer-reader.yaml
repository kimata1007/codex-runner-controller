apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-identity-issuer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [codex-runner-api]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [codex-runner-api]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-identity-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-identity-issuer
subjects:
  - kind: ServiceAccount
    name: codex-identity-issuer
    namespace: codex-security
