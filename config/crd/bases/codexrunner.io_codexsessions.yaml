apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: codexsessions.codexrunner.io
spec:
  group: codexrunner.io
  scope: Namespaced
  names:
    plural: codexsessions
    singular: codexsession
    kind: CodexSession
    shortNames:
      - csession
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - conversationId
                - desiredState
                - sessionData
                - execution
              properties:
                conversationId:
                  type: string
                  minLength: 1
                desiredState:
                  type: string
                  enum: [Active, Suspended]
                idleTimeoutSeconds:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 1800
                sessionData:
                  type: object
                  required: [size, retain]
                  properties:
                    storageClassName:
                      type: string
                    size:
                      type: string
                      minLength: 1
                    retain:
                      type: boolean
                execution:
                  type: object
                  required: [approvalPolicy]
                  properties:
                    model:
                      type: string
                    approvalPolicy:
                      type: string
                      minLength: 1
                repository:
                  type: object
                  required: [url, revision]
                  properties:
                    url:
                      type: string
                      minLength: 1
                    revision:
                      type: string
                      minLength: 1
                access:
                  type: object
                  properties:
                    github:
                      type: object
                      required: [owner, repository, baseBranch, push, pullRequests]
                      properties:
                        owner: {type: string, minLength: 1, maxLength: 39, pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$'}
                        repository: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9_.-]+$'}
                        baseBranch: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$'}
                        push: {type: boolean}
                        pullRequests: {type: boolean}
                    web:
                      type: object
                      required: [fetch, search, registries, requestsPerMinute]
                      properties:
                        fetch: {type: boolean}
                        search: {type: boolean}
                        requestsPerMinute: {type: integer, format: int64, minimum: 1, maximum: 600}
                        registries:
                          type: array
                          x-kubernetes-list-type: set
                          maxItems: 3
                          items: {type: string, enum: [go, npm, pypi]}
                    model:
                      type: object
                      required: [budgetMicros, requestsPerMinute, models]
                      properties:
                        budgetMicros: {type: integer, format: int64, minimum: 1, maximum: 1000000000000}
                        requestsPerMinute: {type: integer, format: int64, minimum: 1, maximum: 1200}
                        models:
                          type: array
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [name]
                          minItems: 1
                          maxItems: 8
                          items:
                            type: object
                            required: [name, maxInputBytes, maxOutputTokens, inputMicrosPerMillion, outputMicrosPerMillion]
                            properties:
                              name: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'}
                              maxInputBytes: {type: integer, format: int64, minimum: 1, maximum: 1048576}
                              maxOutputTokens: {type: integer, format: int64, minimum: 1, maximum: 131072}
                              inputMicrosPerMillion: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
                              outputMicrosPerMillion: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
                credentialsRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Suspended, Starting, Ready, Busy, WaitingForApproval, Failed, Terminating]
                threadId:
                  type: string
                podName:
                  type: string
                workspaceClaim:
                  type: string
                lastActivityAt:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      observedGeneration: {type: integer, format: int64}
                observedGeneration:
                  type: integer
                  format: int64
