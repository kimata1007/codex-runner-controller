apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessionpolicies.codexrunner.io
spec:
  group: codexrunner.io
  scope: Namespaced
  names:
    plural: sessionpolicies
    singular: sessionpolicy
    kind: SessionPolicy
    listKind: SessionPolicyList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: self.metadata.name == self.spec.workload.podUID
              message: policy name must match the enrolled Pod UID
          properties:
            spec:
              type: object
              required: [workload, version, expiresAt, revoked, grants]
              x-kubernetes-validations:
                - rule: self == oldSelf || self.version > oldSelf.version
                  message: changing a policy requires increasing its version
                - rule: '!oldSelf.revoked || self.revoked'
                  message: a revoked Pod UID cannot be reauthorized
              properties:
                workload:
                  type: object
                  required: [sessionName, sessionUID, podName, podUID, nodeName, nodeUID, serviceAccountName, serviceAccountUID]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: workload identity bindings are immutable
                  properties:
                    sessionName: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9][a-z0-9-]*$'}
                    sessionUID: {type: string, minLength: 1, maxLength: 128}
                    podName: {type: string, minLength: 1, maxLength: 253}
                    podUID: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9][a-z0-9-]*$'}
                    nodeName: {type: string, minLength: 1, maxLength: 253}
                    nodeUID: {type: string, minLength: 1, maxLength: 128}
                    serviceAccountName: {type: string, minLength: 1, maxLength: 253}
                    serviceAccountUID: {type: string, minLength: 1, maxLength: 128}
                version: {type: integer, format: int64, minimum: 1}
                expiresAt: {type: string, format: date-time}
                revoked: {type: boolean}
                github:
                  type: object
                  required: [owner, repository, baseBranch, push, pullRequests]
                  properties:
                    owner: {type: string, minLength: 1, maxLength: 39, pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$'}
                    repository: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9_.-]+$'}
                    baseBranch: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$'}
                    push: {type: boolean}
                    pullRequests: {type: boolean}
                web:
                  type: object
                  required: [fetch, search, registries, requestsPerMinute]
                  properties:
                    fetch: {type: boolean}
                    search: {type: boolean}
                    requestsPerMinute: {type: integer, format: int64, minimum: 1, maximum: 600}
                    registries:
                      type: array
                      x-kubernetes-list-type: set
                      maxItems: 3
                      items: {type: string, enum: [go, npm, pypi]}
                model:
                  type: object
                  required: [budgetMicros, requestsPerMinute, models]
                  properties:
                    budgetMicros: {type: integer, format: int64, minimum: 1, maximum: 1000000000000}
                    requestsPerMinute: {type: integer, format: int64, minimum: 1, maximum: 1200}
                    models:
                      type: array
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      minItems: 1
                      maxItems: 8
                      items:
                        type: object
                        required: [name, maxInputBytes, maxOutputTokens, inputMicrosPerMillion, outputMicrosPerMillion]
                        properties:
                          name: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'}
                          maxInputBytes: {type: integer, format: int64, minimum: 1, maximum: 1048576}
                          maxOutputTokens: {type: integer, format: int64, minimum: 1, maximum: 131072}
                          inputMicrosPerMillion: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
                          outputMicrosPerMillion: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
                grants:
                  type: array
                  maxItems: 16
                  items:
                    type: object
                    required: [source, destination, protocol, port]
                    properties:
                      source: {type: string, minLength: 1, maxLength: 528}
                      destination: {type: string, minLength: 1, maxLength: 528}
                      protocol: {type: string, enum: [tcp]}
                      port: {type: integer, minimum: 1, maximum: 65535}
