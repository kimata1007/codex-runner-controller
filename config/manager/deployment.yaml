apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-runner-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-runner-controller
    spec:
      serviceAccountName: codex-runner-controller
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/kimata1007/codex-runner-controller:latest
          imagePullPolicy: IfNotPresent
          command: ["/runner-controller"]
          args: ["--metrics-bind-address=:8080"]
          env:
            - name: RUNNER_AGENT_IMAGE
              value: ghcr.io/kimata1007/codex-runner-agent:latest
            - name: RUNNER_EVENT_URL
              value: http://runner-api.codex-system.svc.cluster.local:8080/internal/runs
            - name: RUNNER_AGENT_TOKEN_SECRET_NAME
              value: codex-runner-tokens
            - name: RUNNER_AGENT_TOKEN_SECRET_KEY
              value: token
            - name: RUNNER_SERVICE_ACCOUNT_NAME
              value: codex-runner-agent
          ports:
            - name: metrics
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
