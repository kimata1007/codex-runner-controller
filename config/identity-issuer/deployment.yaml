apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-identity-issuer
  namespace: codex-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-identity-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-identity-issuer
    spec:
      serviceAccountName: codex-identity-issuer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: ghcr.io/kimata1007/codex-identity-issuer:v0.0.18
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          volumeMounts:
            - name: signer
              mountPath: /var/run/codex/issuer-ca
              readOnly: true
            - name: https
              mountPath: /var/run/codex/issuer-tls
              readOnly: true
      volumes:
        - name: signer
          secret:
            secretName: codex-identity-signing-root
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: ca.key
                path: ca.key
              - key: bundle.crt
                path: bundle.crt
        - name: https
          secret:
            secretName: codex-identity-issuer-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: codex-identity-issuer
  namespace: codex-security
spec:
  selector:
    app.kubernetes.io/name: codex-identity-issuer
  ports:
    - name: https
      port: 8443
      targetPort: https
