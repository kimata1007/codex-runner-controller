apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-auth-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-runner-auth-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-runner-auth-broker
    spec:
      serviceAccountName: codex-runner-agent
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-broker
          image: ghcr.io/kimata1007/codex-runner-agent:v0.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: RUNNER_AGENT_ADDR
              value: :8081
            - name: RUNNER_AUTH_BROKER
              value: "true"
            - name: CODEX_HOME
              value: /var/lib/codex
            - name: RUNNER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-runner-tokens
                  key: agent-token
            - name: CODEX_CWD
              value: /var/lib/codex/workspace
          volumeMounts:
            - name: codex-home
              mountPath: /var/lib/codex
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: codex-home
          emptyDir: {}
