server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not let browser/CDN caches pin an outdated PWA controller or HTML.
  location = /sw.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /healthz {
    proxy_pass http://runner-api:8080/healthz;
  }

  location /v1/ {
    proxy_pass http://runner-api:8080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
