apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner-pwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-runner-pwa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-runner-pwa
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/kimata1007/codex-runner-pwa:v0.0.15
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
