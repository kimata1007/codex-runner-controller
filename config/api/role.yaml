apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-runner-api
rules:
  - apiGroups: ["codex.example.com"]
    resources: ["codexsessions"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["codex.example.com"]
    resources: ["codexsessions/status"]
    verbs: ["get", "patch", "update"]
