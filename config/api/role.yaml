apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-runner-api
rules:
  - apiGroups: ["codexrunner.io"]
    resources: ["codexsessions"]
    verbs: ["get", "create", "patch", "update", "delete"]
  - apiGroups: ["codexrunner.io"]
    resources: ["codexsessions/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["codex-runner-chatgpt-auth"]
    verbs: ["get", "update"]
