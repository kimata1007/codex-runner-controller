apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-runner-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-runner-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-runner-api
    spec:
      serviceAccountName: codex-runner-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kimata1007/codex-runner-api:v0.0.10
          imagePullPolicy: IfNotPresent
          command: ["/runner-api"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUNNER_API_ADDR
              value: :8080
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LIBSQL_URL
              value: http://libsql:8080
            - name: LIBSQL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-runner-tokens
                  key: libsql-auth-token
                  optional: true
            - name: RUNNER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-runner-tokens
                  key: api-token
            - name: RUNNER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-runner-tokens
                  key: agent-token
            - name: RUNNER_AUTH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-runner-tokens
                  key: runner-auth-encryption-key
                  optional: true
            - name: CODEX_APPROVAL_POLICY
              value: never
            - name: CODEX_CWD
              value: /var/lib/codex/workspace
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
