name: Kubernetes E2E (Kind)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kind-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Create Kind Kubernetes cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: codex-e2e
          wait: 120s

      - name: Build the images under test
        run: |
          docker build -f Dockerfile.runner-api -t local/runner-api:e2e .
          docker build -f Dockerfile.runner-controller -t local/runner-controller:e2e .
          docker build -f tests/e2e/fake-app-server/Dockerfile -t local/runner-agent:e2e .

      - name: Load images into Kind
        run: |
          kind load docker-image --name codex-e2e \
            local/runner-api:e2e \
            local/runner-controller:e2e \
            local/runner-agent:e2e
          kubectl get nodes

      - name: Run E2E checks
        run: bash tests/e2e/run.sh

      - name: Collect Kubernetes diagnostics
        if: always()
        run: bash tests/e2e/collect-debug.sh "${{ runner.temp }}/kind-e2e-debug"

      - name: Upload diagnostics when failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-e2e-debug
          path: ${{ runner.temp }}/kind-e2e-debug/
          if-no-files-found: warn
          retention-days: 7

  identity-e2e:
    name: Kubernetes identity and transport
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create multi-node Kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: codex-identity
          config: tests/e2e/identity/kind.yaml
          wait: 120s
      - name: Build and load the image
        run: |
          docker build -f Dockerfile.identity-issuer -t local/codex-identity-issuer:e2e .
          docker build -f Dockerfile.node-proxy -t local/codex-node-proxy:e2e .
          docker build -f tests/e2e/transport/fixture/Dockerfile -t local/codex-transport-fixture:e2e .
          kind load docker-image --name codex-identity \
            local/codex-identity-issuer:e2e local/codex-node-proxy:e2e local/codex-transport-fixture:e2e
      - name: Verify node attestation and policy revocation
        run: bash tests/e2e/identity/run.sh
      - name: Verify socket-attributed routes and fail-closed networking
        run: bash tests/e2e/transport/run.sh
      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          kubectl -n codex-security get pods -o wide
          kubectl -n codex-security logs deployment/codex-identity-issuer --all-pods=true || true
          kubectl -n codex-security logs daemonset/codex-node-proxy --all-pods=true || true
          kubectl -n codex-sessions get events --sort-by=.lastTimestamp
