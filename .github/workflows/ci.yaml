name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
      - name: Check web assets
        run: |
          node --check web/app.js
          node --check web/sw.js
          node -e "JSON.parse(require('node:fs').readFileSync('web/manifest.webmanifest', 'utf8'))"

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Validate Kustomize output
        run: kubectl kustomize config > /tmp/codex-runner-manifests.yaml
      - name: Validate YAML is non-empty
        run: test -s /tmp/codex-runner-manifests.yaml
