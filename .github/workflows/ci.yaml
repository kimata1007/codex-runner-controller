name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify gofmt formatting
        run: |
          unformatted="$(git ls-files '*.go' | xargs -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'The following Go files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test zero-trust concurrency
        run: go test -race ./internal/zerotrust/... ./internal/modelproxy/... ./internal/webproxy/... ./internal/githubproxy/...

  web:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.5
      - name: Check web assets
        run: |
          node --check web/app.js
          node --check web/sw.js
          node -e "JSON.parse(require('node:fs').readFileSync('web/manifest.webmanifest', 'utf8'))"

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Validate Kustomize output
        run: |
          kubectl kustomize config > /tmp/codex-runner-manifests.yaml
          kubectl kustomize config/identity-issuer > /tmp/codex-identity-issuer-manifests.yaml
          kubectl kustomize config/node-proxy > /tmp/codex-node-proxy-manifests.yaml
          kubectl kustomize config/model-proxy > /tmp/codex-model-proxy-manifests.yaml
          kubectl kustomize config/web-proxy > /tmp/codex-web-proxy-manifests.yaml
          kubectl kustomize config/github-proxy > /tmp/codex-github-proxy-manifests.yaml
      - name: Validate YAML is non-empty
        run: |
          test -s /tmp/codex-runner-manifests.yaml
          test -s /tmp/codex-identity-issuer-manifests.yaml
          test -s /tmp/codex-node-proxy-manifests.yaml
          test -s /tmp/codex-model-proxy-manifests.yaml
          test -s /tmp/codex-web-proxy-manifests.yaml
          test -s /tmp/codex-github-proxy-manifests.yaml

  container-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runner-api
            dockerfile: Dockerfile.runner-api
          - name: runner-controller
            dockerfile: Dockerfile.runner-controller
          - name: runner-agent
            dockerfile: Dockerfile.runner-agent
          - name: runner-pwa
            dockerfile: Dockerfile.runner-pwa
          - name: identity-issuer
            dockerfile: Dockerfile.identity-issuer
          - name: node-proxy
            dockerfile: Dockerfile.node-proxy
          - name: model-proxy
            dockerfile: Dockerfile.model-proxy
          - name: web-proxy
            dockerfile: Dockerfile.web-proxy
          - name: github-proxy
            dockerfile: Dockerfile.github-proxy
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Build container image
        run: |
          build_args=()
          if [[ "${{ matrix.name }}" == "runner-agent" ]]; then
            build_args+=(--build-arg "CODEX_CLI_VERSION=$(cat CODEX_CLI_VERSION)")
          fi
          docker build \
            "${build_args[@]}" \
            --file "${{ matrix.dockerfile }}" \
            --tag "local/${{ matrix.name }}:${{ github.sha }}" \
            .
