name: Format PR 102 Go code
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/delete-conversations' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/delete-conversations
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format changed Go code
        run: |
          git diff --name-only origin/main...HEAD -- '*.go' > /tmp/go-changed-files
          if [ -s /tmp/go-changed-files ]; then
            while IFS= read -r file; do
              gofmt -w "$file"
            done < /tmp/go-changed-files
          fi
          git diff --check
          if git diff --quiet; then
            echo 'All changed Go files are already gofmt-clean'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "style: apply gofmt to session deletion PR"
          git push origin HEAD:feat/delete-conversations
