<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <title>Codex Runner</title>
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">CODEX RUNNER</p>
        <h1>セッション会話</h1>
        <p id="status" class="status" role="status" aria-live="polite">接続確認中…</p>
      </header>

      <section class="settings" aria-label="会話設定">
        <p class="settings-help">接続設定は済んでいます。この画面からそのまま会話できます。</p>
        <label>モード
          <select id="mode">
            <option value="chat">chat（相談）</option>
            <option value="implement">implement（実装）</option>
          </select>
        </label>
        <label id="repository-fields" class="hidden">リポジトリURL <input id="repository-url" type="url" placeholder="https://github.com/org/repo.git"></label>
        <label id="revision-fields" class="hidden">リビジョン <input id="repository-revision" value="main"></label>
      </section>

      <section class="conversation" aria-label="会話">
        <div class="conversation-toolbar">
          <button id="new-conversation" type="button">新しい会話</button>
          <span id="conversation-id" class="muted">会話未作成</span>
        </div>
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <form id="message-form" class="composer">
          <textarea id="message" rows="3" placeholder="Codexに相談する、または実装を依頼する" required></textarea>
          <button type="submit">送信</button>
        </form>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
